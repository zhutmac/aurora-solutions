<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>极光 · 产品解决方案库</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: linear-gradient(135deg, #0f0c29 0%, #1a1a4e 50%, #24243e 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 48px 20px;
        }
        .container { max-width: 820px; width: 100%; }
        .header { text-align: center; margin-bottom: 44px; }
        .header h1 { font-size: 32px; font-weight: 700; color: #fff; margin-bottom: 12px; }
        .header p { font-size: 16px; color: rgba(255,255,255,0.6); }

        .brand-group { margin-bottom: 36px; }
        .brand-label {
            display: flex; align-items: center; gap: 12px;
            font-size: 13px; font-weight: 600; letter-spacing: 0.06em;
            text-transform: uppercase; color: rgba(255,255,255,0.55);
            margin-bottom: 16px; padding-left: 4px;
        }
        .brand-label::after { content: ""; flex: 1; height: 1px; background: rgba(255,255,255,0.12); }
        .brand-label .tag {
            font-size: 11px; font-weight: 600; letter-spacing: 0; text-transform: none;
            color: rgba(255,255,255,0.7); background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.12); border-radius: 999px; padding: 2px 10px;
        }

        .solutions { display: flex; flex-direction: column; gap: 18px; }
        .card {
            display: flex; align-items: center; gap: 24px;
            background: rgba(255,255,255,0.06); backdrop-filter: blur(12px);
            border: 1px solid rgba(255,255,255,0.1); border-radius: 16px;
            padding: 26px 30px; text-decoration: none; transition: all 0.3s ease;
        }
        .card:hover {
            background: rgba(255,255,255,0.12); border-color: rgba(255,255,255,0.25);
            transform: translateY(-2px); box-shadow: 0 12px 40px rgba(0,0,0,0.3);
        }
        .card.disabled { opacity: 0.5; pointer-events: none; }
        .card-icon {
            font-size: 38px; flex-shrink: 0; width: 62px; height: 62px;
            display: flex; align-items: center; justify-content: center;
            background: rgba(255,255,255,0.08); border-radius: 14px;
        }
        .card-content h2 { font-size: 20px; font-weight: 600; color: #fff; margin-bottom: 6px; }
        .card-content p { font-size: 14px; color: rgba(255,255,255,0.5); line-height: 1.5; }
        .card-meta {
            margin-left: auto; display: flex; align-items: center; gap: 14px; flex-shrink: 0;
        }
        .badge {
            font-size: 12px; color: rgba(255,255,255,0.55);
            border: 1px solid rgba(255,255,255,0.15); border-radius: 999px; padding: 3px 10px;
        }
        .card-arrow { font-size: 20px; color: rgba(255,255,255,0.3); transition: all 0.3s ease; }
        .card:hover .card-arrow { color: rgba(255,255,255,0.7); transform: translateX(4px); }

        .footer { text-align: center; margin-top: 40px; font-size: 12px; color: rgba(255,255,255,0.3); }

        @media (max-width: 600px) {
            .card { padding: 20px; gap: 16px; }
            .card-icon { width: 48px; height: 48px; font-size: 28px; }
            .card-content h2 { font-size: 17px; }
            .header h1 { font-size: 25px; }
            .card-meta .badge { display: none; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>极光 · 产品解决方案库</h1>
            <p>Aurora Mobile · 按产品与客户组织的增长方案</p>
        </div>

        <!-- 品牌分组：EngageLab（出海）。以后新增品牌（如极光 JPush 国内）再复制一个 brand-group 区块。 -->
        <div class="brand-group">
            <div class="brand-label">EngageLab · 全球客户互动平台<span class="tag">出海</span></div>
            <div class="solutions">
                <a class="card" href="./engagelab/ma/">
                    <div class="card-icon">🎯</div>
                    <div class="card-content">
                        <h2>营销自动化 MA</h2>
                        <p>全渠道用户旅程编排，覆盖获客激活、转化、留存复购、流失召回全生命周期</p>
                    </div>
                    <div class="card-meta">
                        <span class="badge">1 个客户方案</span>
                        <span class="card-arrow">→</span>
                    </div>
                </a>
                <!-- 以后新增 EngageLab 产品（AppPush / OTP / Email / SMS / LiveDesk …）在这里加卡片 -->
            </div>
        </div>

        <!-- 品牌分组：极光 JPush（国内）· 占位，暂不可点。接入后把 card 的 disabled 去掉、补 href 即可。 -->
        <div class="brand-group">
            <div class="brand-label">极光 JPush · 开发者服务<span class="tag">国内</span></div>
            <div class="solutions">
                <a class="card disabled" href="#" aria-disabled="true">
                    <div class="card-icon">📲</div>
                    <div class="card-content">
                        <h2>极光推送 JPush</h2>
                        <p>国内主流厂商通道聚合的 App 消息推送服务</p>
                    </div>
                    <div class="card-meta">
                        <span class="badge">即将上线</span>
                        <span class="card-arrow">→</span>
                    </div>
                </a>
                <a class="card disabled" href="#" aria-disabled="true">
                    <div class="card-icon">💬</div>
                    <div class="card-content">
                        <h2>极光短信 / 一键认证</h2>
                        <p>国内短信、语音与号码认证服务</p>
                    </div>
                    <div class="card-meta">
                        <span class="badge">即将上线</span>
                        <span class="card-arrow">→</span>
                    </div>
                </a>
            </div>
        </div>

        <div class="footer">内部方案库 · 数据为估算或公开参考，落地以实测为准</div>
    </div>
</body>
</html>
