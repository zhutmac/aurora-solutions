const HOT_TAGS = new Set(['客户方案','双边平台','强合规']);

GROUPS.forEach(g => {
    const items = SOLUTIONS.filter(s => s.g === g);
    if (!items.length) return;
    const sec = document.createElement('section');
    sec.className = 'group';
    sec.dataset.group = g;
    sec.innerHTML = `<div class="group-title">${g}<span class="n">${items.length}</span></div>
        <div class="grid">${items.map(s => `
        <a class="card" href="${s.href}" data-tags="${s.tags.join('|')}" data-text="${(s.name + ' ' + s.desc + ' ' + s.tags.join(' ')).toLowerCase()}">
            <div class="card-icon">${s.icon}</div>
            <div class="card-body">
                <h2>${s.name}</h2>
                <p>${s.desc}</p>
                <div class="card-tags">${s.tags.map(t => `<span class="tag${HOT_TAGS.has(t) ? ' hot' : ''}">${t}</span>`).join('')}</div>
            </div>
        </a>`).join('')}</div>`;
    groupsEl.appendChild(sec);
});

FILTERS.forEach((f, i) => {
    const b = document.createElement('button');
    b.className = 'chip' + (i === 0 ? ' active' : '');
    b.textContent = f;
    b.dataset.filter = f;
    filtersEl.appendChild(b);
});

let activeFilter = '全部';

function apply() {
    const q = searchEl.value.trim().toLowerCase();
    let shown = 0;
    document.querySelectorAll('.group').forEach(sec => {
        let visibleInGroup = 0;
        sec.querySelectorAll('.card').forEach(card => {
            const tagOk = activeFilter === '全部' || card.dataset.tags.split('|').includes(activeFilter);
            const textOk = !q || card.dataset.text.includes(q);
            const ok = tagOk && textOk;
            card.classList.toggle('hidden', !ok);
            if (ok) { visibleInGroup++; shown++; }
        });
        sec.classList.toggle('hidden', visibleInGroup === 0);
        const n = sec.querySelector('.n');
        if (n) n.textContent = visibleInGroup;
    });
    emptyEl.classList.toggle('show', shown === 0);
}

filtersEl.addEventListener('click', e => {
    const b = e.target.closest('.chip');
    if (!b) return;
    activeFilter = b.dataset.filter;
    filtersEl.querySelectorAll('.chip').forEach(c => c.classList.toggle('active', c === b));
    apply();
});
searchEl.addEventListener('input', apply);
</script>
</body>
</html>
